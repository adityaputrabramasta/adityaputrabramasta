<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Aditya Putra Bramasta Profile Banner</title>
  <desc id="desc">Premium glass-inspired banner in navy, blue, cyan, and teal with the name Aditya Putra Bramasta and subtitle Backend Engineer, API Integrator, UPNVJT.</desc>
  <defs>
    <linearGradient id="bg" x1="82" y1="28" x2="1182" y2="334" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#07101F"/>
      <stop offset="0.48" stop-color="#0B2243"/>
      <stop offset="1" stop-color="#0C4F5C"/>
    </linearGradient>
    <linearGradient id="panel" x1="114" y1="72" x2="786" y2="292" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity="0.18"/>
      <stop offset="1" stop-color="white" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="panelStroke" x1="146" y1="74" x2="1080" y2="296" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#8BE9FF" stop-opacity="0.14"/>
    </linearGradient>
    <linearGradient id="tagFill" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="white" stop-opacity="0.16"/>
      <stop offset="1" stop-color="white" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="floatGlass" x1="918" y1="102" x2="1128" y2="230" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity="0.12"/>
      <stop offset="1" stop-color="white" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="floatStroke" x1="904" y1="96" x2="1146" y2="246" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8BE9FF" stop-opacity="0.08"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1032 94) rotate(131.982) scale(360.11 233.933)">
      <stop stop-color="#60A5FA" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#60A5FA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1000 286) rotate(-176.669) scale(512.871 189.488)">
      <stop stop-color="#22D3EE" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(234 72) rotate(38.7717) scale(270.898 185.871)">
      <stop stop-color="#2DD4BF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="white" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" rx="32" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="32" fill="url(#grid)"/>

  <rect x="0" y="0" width="1280" height="360" rx="32" fill="url(#glowA)"/>
  <rect x="0" y="0" width="1280" height="360" rx="32" fill="url(#glowB)"/>
  <rect x="0" y="0" width="1280" height="360" rx="32" fill="url(#glowC)"/>

  <rect x="1" y="1" width="1278" height="358" rx="31" stroke="white" stroke-opacity="0.12"/>

  <!-- Glass accent card on the right -->
  <g opacity="0.95">
    <rect x="888" y="78" width="288" height="204" rx="24" fill="url(#floatGlass)"/>
    <rect x="888.75" y="78.75" width="286.5" height="202.5" rx="23.25" stroke="url(#floatStroke)"/>
    
    <text x="916" y="122" fill="#7DD3FC" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="1.5">
      CORE ENGINEERING
    </text>
    
    <text x="916" y="156" fill="white" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">
      REST API &amp; Gateways
    </text>
    <text x="916" y="182" fill="#94A3B8" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="13" font-weight="500">
      Node.js · PHP · Python · Redis
    </text>

    <text x="916" y="222" fill="white" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">
      UPN "Veteran" Jatim
    </text>
    <text x="916" y="246" fill="#94A3B8" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="13" font-weight="500">
      S1 Informatika · 1st Place OSN-K
    </text>
  </g>

  <!-- Left Glass Panel -->
  <rect x="92" y="72" width="760" height="214" rx="28" fill="url(#panel)"/>
  <rect x="92.75" y="72.75" width="758.5" height="212.5" rx="27.25" stroke="url(#panelStroke)"/>

  <!-- Accent Lines -->
  <path d="M124 104H278" stroke="#7DD3FC" stroke-opacity="0.9" stroke-width="8" stroke-linecap="round"/>
  <path d="M124 104H222" stroke="white" stroke-opacity="0.85" stroke-width="2" stroke-linecap="round"/>

  <!-- Name & Title -->
  <text x="124" y="168" fill="white" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="42" font-weight="700" letter-spacing="0.2">
    Aditya Putra Bramasta
  </text>
  <text x="124" y="212" fill="#D7F3FF" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="20" font-weight="500">
    Backend Engineer · API Integrator · S1 Informatika
  </text>

  <!-- Mini Tech Badges inside banner -->
  <g opacity="0.96">
    <rect x="124" y="236" width="88" height="34" rx="17" fill="url(#tagFill)"/>
    <rect x="124.5" y="236.5" width="87" height="33" rx="16.5" stroke="white" stroke-opacity="0.11"/>
    <text x="168" y="258" fill="#F7DF1E" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">JS / TS</text>

    <rect x="222" y="236" width="78" height="34" rx="17" fill="url(#tagFill)"/>
    <rect x="222.5" y="236.5" width="77" height="33" rx="16.5" stroke="white" stroke-opacity="0.11"/>
    <text x="261" y="258" fill="#68A063" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">NODE</text>

    <rect x="310" y="236" width="78" height="34" rx="17" fill="url(#tagFill)"/>
    <rect x="310.5" y="236.5" width="77" height="33" rx="16.5" stroke="white" stroke-opacity="0.11"/>
    <text x="349" y="258" fill="#777BB4" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">PHP</text>

    <rect x="398" y="236" width="88" height="34" rx="17" fill="url(#tagFill)"/>
    <rect x="398.5" y="236.5" width="87" height="33" rx="16.5" stroke="white" stroke-opacity="0.11"/>
    <text x="442" y="258" fill="#38B2AC" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">REST API</text>
  </g>
</svg>
